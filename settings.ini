[settings]
language = English

[controller]
ip_address = 192.168.1.10
net_mask = 255.255.255.0
gateway = 192.168.1.1
udp_port = 1000
init_cmds = // Inputs\ngpio PA10 type -1\ngpio PA9 type -1\n// Outputs\ngpio PE0 type 1\ngpio PE1 type 1\ngpio PE0 state 0\ngpio PE1 state 0\n// Camera\nstepdir 0 steppin PA0\nstepdir 0 dirpin PA1\nstepdir 0 limit0pin PA6\nstepdir 0 limit1pin PA4\nstepdir 0 steplen 5000\nstepdir 0 stepmult 160.0\nstepdir 0 accel 10000.0\nstepdir 0 minspeed 10.0\nstepdir 0 maxspeed 300.0\nstepdir 0 pos 0.0\nstepdir 0 posmin -9999.0\nstepdir 0 posmax 9999.0\nstepdir 0 state 1\n// Feeder\nstepdir 1 steppin PB0\nstepdir 1 dirpin PB1\nstepdir 1 limit0pin PC0\nstepdir 1 limit1pin PC1\nstepdir 1 steplen 5000\nstepdir 1 stepmult 162.0\nstepdir 1 accel 1000.0\nstepdir 1 minspeed 1.0\nstepdir 1 maxspeed 100.0\nstepdir 1 pos 0.0\nstepdir 1 posmin -9999.0\nstepdir 1 posmax 9999.0\nstepdir 1 state 1\n

[camera]
ip_address = 192.168.1.243
net_mask = 255.255.255.0
gateway = 192.168.1.1
dhcp = 0
exposure_time = 30000

[scan]
width = 100.0
height = 100.0
; Optical pitch before binning, micrometres. ppm does not set the carriage step or DICOM Pixel Spacing.
bin = 2
pixel_um_x = 21.0
pixel_um_y = 21.0
ppm = 36.571429

[link]
; 1 = on link loss, stop motors where they are. No home and no return to zero.
; 0 = on link loss, home both motors once the controller answers.
hold_motors = 1
; 1 = on link loss, write every tile already captured.
; 0 = on link loss, do not write the open scan. Files already closed stay on disk.
save_captured = 1